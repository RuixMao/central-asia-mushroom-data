name: Daily Data Pipeline
on:
  schedule:
    # Beijing 05:30: refresh trade, logistics and market context before prices.
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      include_prices:
        description: Run the weekly price crawler
        type: boolean
        default: true
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt
      - name: Install Chromium for rendered price sources
        run: python -m playwright install --with-deps chromium
      - name: Fetch trade
        continue-on-error: true
        timeout-minutes: 20
        run: python pipeline/fetch_trade.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          UN_COMTRADE_API_KEY: ${{ secrets.UN_COMTRADE_API_KEY }}
      - name: Fetch daily FX history
        continue-on-error: true
        run: python pipeline/fetch_fx.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Fetch Uzbekistan official trade benchmark
        continue-on-error: true
        run: python pipeline/fetch_uz_official_trade.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Check official trade source registry
        continue-on-error: true
        run: python pipeline/fetch_official_trade_sources.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          UN_COMTRADE_API_KEY: ${{ secrets.UN_COMTRADE_API_KEY }}
      - name: Fetch logistics
        continue-on-error: true
        run: python pipeline/fetch_logistics.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Register Southeast Asia official corridors
        continue-on-error: true
        run: python pipeline/fetch_sea_logistics.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Daily price collection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_prices == true }}
        run: python pipeline/fetch_price.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          COLLECTION_MODE: static
          PROXY_BASE: ${{ secrets.PROXY_BASE }}
          DATA_API_URL: https://api.yinheng.site
          DATA_SYNC_SECRET: ${{ secrets.DATA_SYNC_SECRET }}
      - name: Build comparable daily price summaries
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_prices == true }}
        run: curl --fail --silent --show-error -X POST "$SITE_URL/api/prices/summarize" -H "x-cron-secret:$CRON_SECRET" -H "content-type:application/json" -d '{}'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Fetch verified market context
        continue-on-error: true
        run: python pipeline/fetch_market_context.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Fetch official market avg price (SIAT 1308)
        continue-on-error: true
        run: python pipeline/fetch_wholesale_index.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
