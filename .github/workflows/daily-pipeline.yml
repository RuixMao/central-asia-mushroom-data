name: Daily Data Pipeline
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      include_prices:
        description: Run the weekly price crawler
        type: boolean
        default: true
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt
      - name: Install Chromium for rendered price sources
        run: python -m playwright install --with-deps chromium
      - name: Fetch trade
        run: python pipeline/fetch_trade.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          UN_COMTRADE_API_KEY: ${{ secrets.UN_COMTRADE_API_KEY }}
      - name: Fetch logistics
        run: python pipeline/fetch_logistics.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Daily price collection
        run: python pipeline/fetch_price.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PROXY_BASE: ${{ secrets.PROXY_BASE }}
      - name: Generate customer daily report
        run: python pipeline/generate_report.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
