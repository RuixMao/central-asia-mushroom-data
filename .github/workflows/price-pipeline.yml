name: Price Pipeline
on:
  schedule:
    # Beijing 20:00 / Central Asia 17:00-18:00: evening snapshot.
    - cron: '0 12 * * *'
    # Beijing 07:30 / Central Asia 04:30-05:30: morning baseline.
    - cron: '30 23 * * *'
    # Beijing 09:00 / Central Asia 06:00-07:00: final refresh before publication.
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: Optional platform id
        required: false
        type: string
      collection_point:
        description: Optional collection point id
        required: false
        type: string
      dry_run:
        description: Validate without writing
        type: boolean
        default: false
      collection_mode:
        description: static(默认,日常) / rendered(渲染源) / all(全量)
        required: false
        type: choice
        default: static
        options:
          - static
          - rendered
          - all
      uzum_debug:
        description: 打印 Uzum 渲染页诊断片段(调试商品卡选择器)
        required: false
        type: boolean
        default: false
      magnum_debug:
        description: 打印 Magnum 渲染页诊断片段(逆向 Nuxt API)
        required: false
        type: boolean
        default: false
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt
      - name: Install Chromium for rendered sources
        # 渲染型平台(kaspi/yandex/uzum/magnum)都需要 Chromium:
        # - platform 指定渲染平台(如 uzum-uz)时必装
        # - 全量(platform 为空)或 rendered/all 模式必装
        # - 仅静态平台(platform 指定静态源)时跳过,省 CI 时间
        if: ${{ inputs.collection_mode != 'static' || inputs.platform == 'kaspi-kz' || inputs.platform == 'yandex-uz' || inputs.platform == 'uzum-uz' || inputs.platform == 'magnum-kz' || inputs.platform == '' }}
        run: python -m playwright install --with-deps chromium
      - name: Run deterministic pipeline tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Python syntax check
        run: python -m compileall -q pipeline
      - name: Verify collector dependency graph
        run: python -c "import sys; sys.path.insert(0, 'pipeline'); import fetch_price"
      - name: Collect normalized prices
        continue-on-error: ${{ inputs.platform == 'foodpanda-champa-market-la' || inputs.platform == 'bigc-th' || inputs.platform == 'foodpanda-mm' || inputs.platform == 'verified-sea-research' || inputs.platform == 'laos-myanmar-relaxed' || inputs.platform == 'today-thailand-retail' || inputs.platform == 'today-sea-retail' }}
        run: python pipeline/fetch_price.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PLATFORM: ${{ inputs.platform }}
          COLLECTION_POINT: ${{ inputs.collection_point }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Scheduled runs must include browser-rendered Southeast Asian catalogues.
          COLLECTION_MODE: ${{ inputs.collection_mode || 'daily' }}
          AUDIT_OUTPUT: tmp/price-pipeline-audit.json
          UZUM_DEBUG: ${{ inputs.uzum_debug && '1' || '0' }}
          MAGNUM_DEBUG: ${{ inputs.magnum_debug && '1' || '0' }}
          PROXY_BASE: ${{ secrets.PROXY_BASE }}
          WB_DESTS_JSON: ${{ secrets.WB_DESTS_JSON }}
          # 默认开启闭环：无法由可验证证据解决的记录自动隔离，下次定时采集重试。
          AUTO_REVIEW_QUARANTINE: '1'
          # Vietnam and Cambodia have primary+fallback collectors. A scheduled
          # run must not report success when either country produced zero rows.
          REQUIRED_NONZERO_COUNTRIES: ${{ github.event_name == 'schedule' && 'VN,KH' || (inputs.platform == '' && 'VN,KH' || '') }}
      - name: Report Southeast Asia collection coverage
        if: ${{ always() && inputs.dry_run != true }}
        run: python pipeline/report_sea_coverage.py tmp/price-pipeline-audit.json
      - name: Backfill confirmed Laos retailer listing with relaxed package gate
        if: ${{ inputs.platform == 'foodpanda-champa-market-la' }}
        run: python pipeline/fetch_laos_retail_fallback.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Publish verified Southeast Asia retailer research
        if: ${{ inputs.platform == 'verified-sea-research' }}
        run: python pipeline/publish_verified_sea_retail.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Publish relaxed Laos and Myanmar online prices
        if: ${{ inputs.platform == 'laos-myanmar-relaxed' }}
        run: python pipeline/publish_laos_myanmar_relaxed_retail.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Publish today's verified Thailand prices
        if: ${{ inputs.platform == 'today-thailand-retail' }}
        run: python pipeline/publish_today_thailand_retail.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Publish today's verified Southeast Asia prices
        if: ${{ inputs.platform == 'today-sea-retail' }}
        run: python pipeline/publish_today_sea_retail.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Build daily summaries
        if: ${{ inputs.dry_run != true }}
        run: curl --fail --silent --show-error -X POST "$SITE_URL/api/prices/summarize" -H "x-cron-secret:$CRON_SECRET" -H "content-type:application/json" -d '{}'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
