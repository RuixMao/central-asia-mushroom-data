name: Daily Report Watchdog

permissions:
  actions: write
  contents: read

on:
  schedule:
    # Independent checks after the primary publication window.
    - cron: '23 2 * * *'
    - cron: '53 2 * * *'
  workflow_dispatch:

concurrency:
  group: daily-report-watchdog
  cancel-in-progress: false

jobs:
  ensure-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check today's customer report and start recovery when needed
        run: |
          today="$(TZ=Asia/Shanghai date +%F)"
          curl --fail --silent --show-error \
            "$SITE_URL/api/ingest/report?type=daily" \
            --output /tmp/daily-reports.json

          if python - "$today" /tmp/daily-reports.json <<'PY'
          import json, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          rows = json.load(open(sys.argv[2], encoding="utf-8")).get("records", [])
          def published_day(row):
              try:
                  stamp = datetime.fromisoformat(row["publishedAt"].replace("Z", "+00:00"))
                  return stamp.astimezone(ZoneInfo("Asia/Shanghai")).date().isoformat()
              except (KeyError, TypeError, ValueError):
                  return str(row.get("slug", ""))[:10]
          sys.exit(0 if any(published_day(row) == sys.argv[1] for row in rows) else 1)
          PY
          then
            echo "Customer daily report for $today is already available."
          else
            gh workflow run daily-report.yml --ref main
            echo "Recovery run started for $today."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SITE_URL: ${{ secrets.SITE_URL }}
