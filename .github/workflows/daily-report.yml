name: Customer Daily Report
on:
  schedule:
    # Beijing 10:00 / Central Asia 07:00-08:00.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate DeepSeek connection without publishing a report
        required: false
        default: false
        type: boolean
      publish_revision:
        description: Publish a same-day DeepSeek enhanced revision
        required: false
        default: false
        type: boolean

concurrency:
  group: customer-daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt
      - name: Confirm today's production prices are available
        if: ${{ inputs.validate_only != true }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat()
          site_url = os.environ["SITE_URL"].rstrip("/")
          with urllib.request.urlopen(f"{site_url}/api/prices", timeout=60) as response:
              records = json.load(response).get("records", [])

          today_records = [
              row for row in records
              if row.get("price", {}).get("observationDate") == today
          ]
          if not today_records:
              raise SystemExit(f"No production price records are available for {today}; report publication stopped.")

          countries = sorted({
              row.get("product", {}).get("country")
              for row in today_records
              if row.get("product", {}).get("country")
          })
          expected = {"KZ", "UZ", "KG", "TJ", "TM"}
          missing = sorted(expected - set(countries))
          print(f"Today's production prices: {len(today_records)} records; countries: {', '.join(countries)}")
          if missing:
              print(f"Countries without a valid public price today: {', '.join(missing)}; the report must retain the gap explicitly.")
          PY
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
      - name: Validate DeepSeek V4 Flash connection
        if: ${{ inputs.validate_only == true }}
        run: |
          python - <<'PY'
          import os
          import re
          from openai import OpenAI

          raw_key = os.environ["AI_API_KEY"]
          match = re.search(r"sk-[A-Za-z0-9_-]+", raw_key)
          api_key = match.group(0) if match else raw_key.strip()
          client = OpenAI(
              api_key=api_key,
              base_url=os.environ["AI_BASE_URL"],
          )
          response = client.chat.completions.create(
              model=os.environ["AI_MODEL"],
              messages=[{"role": "user", "content": "仅回复：连接验证成功"}],
              max_tokens=50,
              extra_body={"thinking": {"type": "disabled"}},
          )
          if not (response.choices[0].message.content or "").strip():
              raise RuntimeError("DeepSeek returned an empty response")
          print("DeepSeek V4 Flash connection validated")
          PY
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: https://api.deepseek.com
          AI_MODEL: deepseek-v4-flash
      - name: Generate customer daily report from verified production data
        if: ${{ inputs.validate_only != true }}
        run: python pipeline/generate_report.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: https://api.deepseek.com
          AI_MODEL: deepseek-v4-flash
          REPORT_REVISION: ${{ inputs.publish_revision == true && 'true' || 'false' }}
