name: Laos Retail Price Priority
on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '0 6 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:
jobs:
  laos-price:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt
      - name: Collect Laos online supermarket prices
        continue-on-error: true
        run: python pipeline/fetch_price.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DATA_API_URL: https://api.yinheng.site
          DATA_SYNC_SECRET: ${{ secrets.DATA_SYNC_SECRET }}
          COUNTRY: LA
          COLLECTION_MODE: static
          SEARCH_QUERY_MODE: expanded
      - name: Preserve confirmed retailer listings without package size
        run: python pipeline/fetch_laos_retail_fallback.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Build Laos comparable price summaries
        run: curl --fail --silent --show-error -X POST "$SITE_URL/api/prices/summarize" -H "x-cron-secret:$CRON_SECRET" -H "content-type:application/json" -d '{"country":"LA"}'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
